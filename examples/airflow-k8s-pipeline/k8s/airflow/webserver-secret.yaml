# Static webserver secret key for Airflow.
#
# The Helm chart auto-generates a RANDOM webserver_secret_key on every
# deploy/upgrade when none is provided. When that key changes, the webserver
# and its (KubernetesExecutor) workers disagree on the Flask session-signing
# key, which forces avoidable webserver restarts and logs users out. Pinning a
# static key silences the chart's warning and stabilizes the webserver.
#
# This file is a TEMPLATE — it must NOT contain a real key in version control.
# Generate the secret at deploy time (do not commit the output):
#
#   kubectl create secret generic ids-webserver-secret-key \
#     --namespace default \
#     --from-literal=webserver-secret-key="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
#
# values.yaml references it via:
#   webserverSecretKeySecretName: ids-webserver-secret-key
#
# The secret's data key MUST be exactly `webserver-secret-key` (the name the
# chart looks for). NOTE the secret is intentionally NOT named
# `airflow-webserver-secret-key`: that name is owned by the Helm chart when it
# auto-generates a key, so reusing it makes Helm prune the manually-created
# secret mid-upgrade. A distinct name keeps it outside Helm's ownership.
apiVersion: v1
kind: Secret
metadata:
  name: ids-webserver-secret-key
  namespace: tig-airflow
type: Opaque
stringData:
  webserver-secret-key: "REPLACE_WITH_GENERATED_KEY"
