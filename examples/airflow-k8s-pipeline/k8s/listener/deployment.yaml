apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-listener
  namespace: tig-airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-listener
  template:
    metadata:
      labels:
        app: ids-listener
    spec:
      containers:
      - name: listener
        image: ids-listener:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: LOCALSTACK_ENDPOINT
          value: "http://localstack.tig-airflow.svc.cluster.local:4566"
        - name: SQS_QUEUE_URL
          value: "http://localstack.tig-airflow.svc.cluster.local:4566/000000000000/ids-fdr-queue"
        - name: AIRFLOW_API_URL
          value: "http://airflow-webserver.tig-airflow.svc.cluster.local:8080/api/v1"
        - name: AIRFLOW_USERNAME
          value: "admin"
        - name: AIRFLOW_PASSWORD
          value: "admin"
        - name: POLL_INTERVAL
          value: "5"
        - name: STEREO_PAIR_TIMEOUT
          value: "300"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
